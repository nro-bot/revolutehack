# =============================================================================
#  Revolute: the Sponsorship page (content/data/sponsorship.yaml)
# =============================================================================
#  Renders to /sponsorship/. Plain text only, no HTML. It is reached from the
#  Team tab on the Community page.
# =============================================================================

layout: sponsorship
nav: community            # the bottom tab that is lit on this page
title: "Sponsorship"
description: "Sponsor Revolute and help us make Boston the forefront of Embodied AI. Five tiers, from $2,500."
kicker: "Sponsor Revolute"

dek: "Sponsor Revolute and help us make Boston the forefront of Embodied AI."
contact: "Interested in sponsoring? Email us and we'll follow up."

# ---- Tiers ------------------------------------------------------------------
#  Smallest first. Each tier gets a card listing what it includes.
tiers:
  - name: "Amber"
    price: "$2,500"
  - name: "Garnet"
    price: "$3,500"
  - name: "Sapphire"
    price: "$5,000"
  - name: "Emerald"
    price: "$7,500"
  - name: "Title Sponsor"
    price: "$10,000"

# ---- Benefits ---------------------------------------------------------------
#  `from` is the smallest tier that gets the benefit. That tier and every
#  larger one list it. The name must match a tier's `name` above exactly.
benefits:
  - label: "Logo on website"
    from: "Amber"
  - label: "Thanked at opening & closing"
    from: "Amber"
  - label: "Short shoutout on email announcements"
    from: "Garnet"
  - label: "Logo on T-shirt"
    from: "Garnet"
  - label: "Access to resumes (opt-in by hackers)"
    from: "Sapphire"
  - label: "2-min talk at kickoff"
    from: "Emerald"
  - label: '"Presented by" naming rights'
    from: "Title Sponsor"

# ---- Policies ---------------------------------------------------------------
policies:
  - "Under $2,500 is a gift under MIT policy, so we cannot provide benefits."
  - "Judges will be selected at sole discretion of the organizing committee and not offered as seats."
  - "No recruiting at demo hour or the social! We don't want a super competitive event. Recruiters can be present as individuals in the community."
