# =============================================================================
#  Revolute: hackathon entries (content/data/_projects.yaml)
# =============================================================================
#  One block per project. Each appears under Entries on
#  /previous/ and gets its own page at /projects/<slug>/.
#
#  Media for a project lives in content/images/projects/<slug>/:
#     poster.jpg    required. A still frame, about 960 px wide.
#     preview.mp4   optional. A silent 6 to 8 second loop, 640 px wide.
#                   It plays on the project's card.
#
#  Fields:
#     slug        short name used in the address: letters, digits, hyphens
#     name        the project's name
#     place       1, 2 or 3 for winners. Leave out for other entries.
#     tagline     one line on what it does
#     team        the people, as shown on Devpost
#     alt         describes the poster image for screen readers
#     youtube     the demo video's id. Leave out if there is none.
#     devpost, github   links
#     built_with  short tags
#     about       optional. Two to four sentences, written with the team.
#
#  List winners first: the order here is the order on the page.
# =============================================================================

