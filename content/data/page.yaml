# =============================================================================
#  Revolute homepage: the upcoming hackathon (content/data/page.yaml)
# =============================================================================
#  Renders to /. The page is one card per tab: Overview, Tutorial, Hardware,
#  Agenda. Each card is sized to fit one screen, so keep them short. The
#  Tutorial tab comes from _tutorial.yaml and content/docs/.
#
#  The "Register" button is set once for the whole site, in _site.yaml.
# =============================================================================

layout: upcoming
title: "Thanksgivathon 2026"
description: "Revolute's next robotics and physical AI hackathon in Boston, Nov. 20–21, 2026. Real robot arms, small teams, one weekend."

# ---- Overview ---------------------------------------------------------------
kicker: "Next up"
photo:
  src: "app/overview.jpg"            # a file in content/images/
  alt: "A hacker leans in close to adjust a robot arm"

# Fact tiles under the title. `wide: true` gives a tile the full row on a
# phone. A tile with a `map:` block opens a map in a popup.
facts:
  - label: "When"
    value: "Nov. 20–21, 2026"
  - label: "Where"
    value: "FabLab Kendall"
    map:
      title: "FabLab Kendall"
      address: "325 Main St, Cambridge, MA 02142"
      # The popup shows a Google map of this place. Under it is a link that
      # opens the Maps app: Apple Maps on an iPhone or iPad (`apple_url`),
      # Google Maps everywhere else (`url`). Apple Maps cannot be shown
      # inside another site, so the map in the popup is always Google's.
      embed: "https://www.google.com/maps?q=FabLab%20Kendall%2C%20325%20Main%20St%2C%20Cambridge%2C%20MA%2002142&z=16&output=embed"
      url: "https://www.google.com/maps/search/?api=1&query=FabLab+Kendall%2C+325+Main+St%2C+Cambridge%2C+MA+02142"
      apple_url: "https://maps.apple.com/?q=FabLab+Kendall&address=325+Main+St%2C+Cambridge%2C+MA+02142"
  - label: "Theme"
    value: "TBA"
    wide: true

# ---- Hardware ---------------------------------------------------------------
#  CARRIED OVER from the August 2026 hackathon. Confirm for this event.
hardware:
  title: "What you get"
  # One tile each, with the maker's own product picture. Tapping a tile opens
  # its picture in a popup, with nothing written under it. The `caption` is
  # not shown: it describes the picture for screen readers. The `credit` is
  # not shown either: it records whose picture it is. With a `link:` line,
  # tapping the picture in the popup opens that address, such as the
  # product's page on its maker's site, in a new tab. Add an `embed:` line
  # with the same address to show that page in a popup on this site
  # instead: only for sites that allow being embedded, or the popup stays
  # blank.
  # A tile with a `video:` line plays that file (in content/images/) in the
  # popup instead, with `poster` as the still shown before it starts. A tile
  # with a `youtube:` line plays that video instead: `youtube` is the part
  # of the video's address after "watch?v=", and `youtube_start` skips that
  # many seconds in.
  items:
    - name: "reBot Arm B601 RS"
      photo: "kit/arm.jpg"
      caption: "reBot Arm B601 RS. One per team, with 48 V QDD motors and a 2.5 kg payload."
      youtube: "qOhz4Im6hcM"         # Seeed Studio's gravity compensation demo
    - name: "Leader arm"
      photo: "kit/leader-arm.jpg"
      caption: "Leader arm: StarAI Arm Violin. One per team, for teleoperation and imitation learning."
      credit: "Image: Seeed Studio"
      # Imitation learning: move the leader arm by hand and the follower arm
      # copies you. Made from the original clip in ../content/imitation-robot.mp4.
      video: "kit/imitation.mp4"
      poster: "kit/imitation.jpg"
      # For reference: Seeed's StarAI arm video is youtube pPusiho4JLQ (from
      # 5 s), and its product page is
      # https://www.seeedstudio.com/StarAi-Arm-Violin-p-6571.html
    - name: "UVC Camera"
      photo: "kit/camera.jpg"
      caption: "UVC camera: an Arducam USB camera on a small stand, for the robot's eyes."
      credit: "Image: Arducam, via Core Electronics"

# ---- Agenda -----------------------------------------------------------------
#  From the event's Luma page (the Register link). One row per item:
#     when   the time, in the left column
#     what   what happens
#     note   optional, a smaller line under it
#  Keep it to about four rows a day so the card fits a phone screen.
agenda:
  - day: "Friday, Nov. 20"
    rows:
      - { when: "6:00 PM", what: "Pre-hackathon setup", note: "Optional. Teams can come the night before to set up their arm." }
  - day: "Saturday, Nov. 21"
    rows:
      - { when: "10:00 AM", what: "Hacking begins" }
      - { when: "4:00 PM", what: "Open house and demos", note: "Teams show what they built. Open to everyone." }
      - { when: "5:00 PM", what: "Wrap" }

# ---- Tracks -----------------------------------------------------------------
#  Topics a team can pick, shown under the agenda. Each is a Markdown file in
#  content/tracks/: its first heading is the track's name, and the rest is
#  shown when the track is tapped. Links in it open in a new tab.
tracks:
  title: "Tracks"
  files:
    - sim-to-real.md
    - gravity-compensation.md
    - object-tracking.md
    - 3d-modeling.md
