# =============================================================================
#  Revolute: the previous hackathon (content/data/previous.yaml)
# =============================================================================
#  Renders to /previous/. Four tabs: Entries, Agenda, Photos, About.
#  Entries come from _projects.yaml, winners first. Everything else is here.
# =============================================================================

layout: previous
title: "Revolute v1.08"
description: "Revolute Hackathon v1.08: cooking with robot arms. Aug. 1–2, 2026 at FabLab Kendall, Cambridge. Winners, every entry, the agenda and photos."

# The line under the tabs.
kicker: "Revolute v1.08 · Cooking with robot arms"

# ---- Agenda -----------------------------------------------------------------
agenda:
  - day: "Saturday, Aug. 1"
    rows:
      - { when: "10:00 AM", what: "Intro tutorial", note: "Setting up the hardware and software stack" }
      - { when: "12:01 PM", what: "Opening ceremony" }
      - { when: "1:00 PM",  what: "Lunch and office hours", note: "Form teams, mentors available for setup" }
      - { when: "2:00 PM",  what: "Hacking begins" }
      - { when: "6:15 PM",  what: "Intermission: dinner" }
      - { when: "10:00 PM", what: "Hacking ends for the day" }
  - day: "Sunday, Aug. 2"
    rows:
      - { when: "10:00 AM", what: "Doors open, breakfast bites" }
      - { when: "12:01 PM", what: "Lunch" }
      - { when: "3:00 PM",  what: "Science-fair style demos and judging", note: "Judges go around to tables for demos" }
      - { when: "4:00 PM",  what: "Final submissions", note: "GitHub, project documentation, and a one-minute video" }
      - { when: "4:15 PM",  what: "Awards" }
      - { when: "4:30 PM",  what: "Light snacks and social" }
      - { when: "5:00 PM",  what: "That’s a wrap!" }

# ---- Photos -----------------------------------------------------------------
#  A short strip taken from a gallery album (a folder in content/images/).
#  `pick` lists the photos to show, in order, by any part of their filename.
#  Captions and the credit for the album are written in gallery.yaml.
