# =============================================================================
#  Revolute — site-wide settings (content/data/_site.yaml)
# =============================================================================
#  Shared by every page. Not a page itself (files starting with "_" are
#  skipped).
# =============================================================================

# Announcement line in the header of every page (desktop only). Edit `text`
# (and the optional `url` it links to); comment out the whole `banner:` block
# to hide it.
banner:
  text: "Register for the ReBot Arms workshop on Oct. 9, 2026"
  #url: 

# =============================================================================
#  App pages (those with a `layout:` key). Everything below is shared by the
#  homepage, Previous, Gallery, Community and every project page.
# =============================================================================

name: "Revolute"
# Two short lines shown beside the logo.
tagline:
  - "Boston · robotics"
  - "+ physical AI"
description: "Revolute is Boston's robotics and physical AI hackathon. Real robot arms, small teams, one weekend."
# The site's public address, used for share previews and canonical links.
url: "https://revolutehack.com"
email: "revolutehack@gmail.com"

# The "Register" button in the bottom bar and on the homepage. It opens Luma's
# event page in a popup, so people sign up without leaving the site.
#   url    the event's page on Luma
#   embed  the same event as Luma's "Embed Event Page" address. Find it on the
#          event's manage page, under More, "Embed Registration Button".
# PLACEHOLDER: this is the August 2026 hackathon, whose registration has
# closed. Swap both lines when the next event is on Luma.
register:
  label: "Register"
  url: "https://luma.com/kxq4yxr8"
  embed: "https://luma.com/embed/event/evt-cW5gZ6vjmv8zPmR/simple"
  title: "Register on Luma"
  about: "Luma's sign-up page for the event loads here."
  action: "Open on Luma"

# The bottom bar. `path` is the page's address ("" is the homepage).
# `icon` is one of the drawings in theme/templates/app_macros.html.
nav:
  - { id: upcoming,  label: "Upcoming",  path: "",           icon: cal }
  - { id: previous,  label: "Previous",  path: "previous/",  icon: cup }
  - { id: gallery,   label: "Gallery",   path: "gallery/",   icon: pic }
  - { id: community, label: "Community", path: "community/", icon: ppl }

# Social accounts: the small icons above the bottom bar on every page, and
# the list on the Community page. Each opens in a popup with a button to the
# real page. `embed` is optional: the address that account offers for showing
# it inside another page. Without it the popup shows `about` and the button.
social:
  - id: instagram
    label: "Instagram"
    handle: "@revolutehack"
    icon: ig
    url: "https://instagram.com/revolutehack"
    embed: "https://www.instagram.com/revolutehack/embed/"
    about: "Photos and videos from the hackathons and the bench."
    verb: "Follow"
    action: "Open in Instagram"
  - id: luma
    label: "Luma"
    handle: "Revolute Community"
    icon: luma
    url: "https://luma.com/user/usr-KxkVCLYqVvA7jev"
    # Luma does not allow its profile page inside another site, so the popup
    # shows Revolute's calendar instead: Luma's list of upcoming events. The
    # address comes from the calendar's Settings, Embed, on Luma.
    embed: "https://luma.com/embed/calendar/cal-SyMvL93leFlSRRd/events"
    about: "Every upcoming Revolute event, each with its own sign-up."
    verb: "Events"
    action: "Open on Luma"
